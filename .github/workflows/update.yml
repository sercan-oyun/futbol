name: Verileri güncelle

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Veriyi çek
        env:
          FD_TOKEN: ${{ secrets.FD_TOKEN }}
          AF_KEY: ${{ secrets.AF_KEY }}
        run: node scripts/fetch.mjs
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/all.json
          git diff --staged --quiet || git commit -m "veri güncellendi: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
